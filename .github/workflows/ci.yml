name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Kiểm tra định dạng mã nguồn (Prettier)
        run: npm run format:check

      - name: Chạy ESLint (Client & Server)
        run: npm run lint

      - name: Kiểm tra kiểu TypeScript (tsc)
        run: npm run typecheck

      - name: Chạy Unit & Integration Tests (Vitest)
        run: npm run test
